version: "2"

run:
  modules-download-mode: readonly
  tests: true

linters:
  enable:
    - errcheck
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused

  settings:
    errcheck:
      # An unchecked type assertion panics; an explicit `_` is a decision the
      # author already wrote down, so only the first is worth reporting.
      check-type-assertions: true
      check-blank: false

    govet:
      enable-all: true
      disable:
        # Reorders struct fields to shave pointer-scanning bytes. The wire and
        # config structs here are read far more often than they are allocated.
        - fieldalignment
        # Rebinding err inside a narrower scope is ordinary Go.
        - shadow

    gocritic:
      enabled-tags:
        - diagnostic
        - style
        - performance
      disabled-checks:
        - unnamedResult
        - hugeParam
        # Ranging by value over a large struct is fine outside a hot loop, and
        # indexing instead costs more readability than it buys.
        - rangeValCopy

    revive:
      confidence: 0.8

    gosec:
      excludes:
        - G104 # Covered by errcheck.

  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
    rules:
      # A test may assert a type it just constructed and ignore an error it is
      # deliberately provoking.
      - path: _test\.go
        linters:
          - errcheck
          - gosec

issues:
  max-issues-per-linter: 0
  max-same-issues: 0

# No `formatters:` section on purpose. golangci-lint's gofmt/goimports run
# through a forked parser that rejects Go 1.27 generic methods with
# "method must have no type parameters". Formatting is checked in CI with the
# toolchain's own gofmt and goimports instead; put this back once upstream
# catches up.
